<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị – M&Q HOME TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/png" href="/img/icon.png">
<style>
  body{background:var(--bg)}
  /* ---- Đăng nhập ---- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#FDE7F3,#F3E4FA 55%,#FAEFDE)}
  .login{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(120,24,120,.14);padding:34px;width:min(420px,100%)}
  .login img{height:70px;display:block;margin:0 auto 6px}
  .login h1{text-align:center;font-size:17px;margin:0 0 22px;color:var(--muted);font-weight:500}
  /* ---- Khung quản trị ---- */
  .adm{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  .side{background:#fff;border-right:1px solid var(--line);padding:0 0 20px;position:sticky;top:0;height:100vh;overflow:auto}
  .side__top{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  .side__top img{height:42px}
  .side__badge{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.5px;background:var(--grad);color:#fff;padding:3px 10px;border-radius:999px}
  .side nav{display:grid;gap:3px;padding:12px 10px}
  .side nav button,.side nav a{text-align:left;border:0;background:none;color:#4a4252;padding:10px 13px;border-radius:10px;font-weight:500;font-size:14px;display:flex;gap:9px;align-items:center;font-family:inherit}
  .side nav button:hover,.side nav a:hover{background:var(--brand-soft);color:var(--brand-dark)}
  .side nav button.active{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 3px 12px rgba(194,26,158,.28)}
  .side nav .sep{height:1px;background:var(--line);margin:8px 6px}
  .main{padding:22px 26px 60px}
  .main h1{font-size:22px;margin:0 0 4px}
  .main .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  /* ---- Thẻ số liệu ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:#fff;padding:16px 18px;border-radius:14px;box-shadow:var(--shadow);border-top:3px solid transparent;border-image:var(--grad) 1}
  .stat b{display:block;font-size:23px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.25}
  .stat span{font-size:12.5px;color:var(--muted)}
  /* ---- Bảng ---- */
  .panel{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{background:#FCF8FD;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td input,td select,td textarea{padding:6px 9px;border-radius:8px;border:1px solid var(--line);font-size:13px;width:100%;font-family:inherit}
  td input:focus,td select:focus,td textarea:focus{outline:none;border-color:var(--pink)}
  td input[type=number]{width:118px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .bar input,.bar select{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit}
  .bar input:focus,.bar select:focus{outline:none;border-color:var(--pink)}
  .thumb{width:46px;height:46px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#faf7fb}
  .thumbs{display:flex;gap:-6px}
  .thumbs img{width:38px;height:38px;object-fit:cover;border-radius:8px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.12);margin-right:-10px}
  .sm{font-size:12px;color:var(--muted)}
  .btn--sm{padding:7px 14px;font-size:12.5px}
  .row-hidden{opacity:.45}
  .rowlink{cursor:pointer}
  .rowlink:hover{background:#FDF7FC}
  /* ---- Chi tiết đơn ---- */
  .drawer{position:fixed;inset:0;background:rgba(28,20,32,.5);display:none;z-index:80}
  .drawer.open{display:block}
  .drawer__panel{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:var(--bg);overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
  .drawer__head{background:#fff;padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:2}
  .drawer__head h2{margin:0;font-size:18px}
  .drawer__close{margin-left:auto;border:0;background:#f3eef5;width:34px;height:34px;border-radius:50%;font-size:16px}
  .dsec{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin:16px 20px;padding:16px 18px}
  .dsec h3{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .dline{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px}
  .dline span:first-child{color:var(--muted);flex:none}
  .ditem{display:grid;grid-template-columns:72px 1fr auto;gap:13px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:center}
  .ditem:last-child{border-bottom:0}
  .ditem img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#faf7fb}
  .ditem__name{font-size:13.5px;line-height:1.4;font-weight:500}
  .ditem__meta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .ditem__right{text-align:right;white-space:nowrap}
  .ditem__right b{color:var(--brand-dark)}
  .dtotal{border-top:2px solid var(--line);margin-top:10px;padding-top:12px}
  .dtotal .dline:last-child{font-size:18px;font-weight:700}
  .dtotal .dline:last-child span:last-child{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .statusrow{display:flex;gap:8px;flex-wrap:wrap}
  .statusrow button{border:1.5px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font-size:13px;font-family:inherit}
  .statusrow button.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:600}
  .copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  @media(max-width:860px){
    .adm{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    .side nav{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));display:grid}
    .main{padding:16px}
    .tbl-scroll{overflow-x:auto}
    table{min-width:660px}
  }
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login">
    <img src="/img/logo.png" alt="M&Q HOME TECH">
    <h1>Trang quản trị cửa hàng</h1>
    <div id="loginSb">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label>Mật khẩu</label><input id="pass" type="password" autocomplete="current-password"></div>
    </div>
    <div id="loginNode" class="hidden"><div class="field"><label>Mã quản trị (ADMIN_KEY)</label><input id="key" type="password"></div></div>
    <button class="btn btn--block btn--lg" id="loginBtn">Đăng nhập</button>
    <p id="loginErr" style="color:var(--danger);font-size:13px;text-align:center"></p>
    <p class="sm" style="text-align:center;margin-bottom:0">Tài khoản tạo trong Supabase → Authentication → Users</p>
  </div>
</div>

<div id="adm" class="adm hidden">
  <aside class="side">
    <div class="side__top"><img src="/img/logo.png" alt="M&Q HOME TECH"><div><span class="side__badge">QUẢN TRỊ</span></div></div>
    <nav id="nav">
      <button data-v="dash" class="active">📊 Tổng quan</button>
      <button data-v="orders">📦 Đơn hàng</button>
      <button data-v="products">🧸 Sản phẩm</button>
      <button data-v="customers">👥 Khách hàng</button>
      <button data-v="reviews">⭐ Đánh giá</button>
      <button data-v="sync">🔄 Đồng bộ Shopee</button>
      <button data-v="settings">⚙️ Cài đặt</button>
      <div class="sep"></div>
      <a href="/" target="_blank">🛍️ Xem cửa hàng</a>
      <button id="logout">🚪 Đăng xuất</button>
    </nav>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="drawer" class="drawer"><div class="drawer__panel" id="drawerPanel"></div></div>
<div id="toast" class="toast"></div>
<div id="lightbox" class="lightbox" hidden><img alt=""></div>

<script src="/config.js"></script>
<script>
const $=s=>document.querySelector(s); const fmt=n=>(+n||0).toLocaleString('vi-VN')+'₫';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={new:'Mới đặt',confirmed:'Đã xác nhận',shipping:'Đang giao',done:'Hoàn thành',cancelled:'Đã hủy'};
const dt=s=>new Date(s).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const CFG=window.MQ_CONFIG||{}; const SB=CFG.supabaseUrl?{url:CFG.supabaseUrl.replace(/\/$/,''),key:CFG.supabaseAnonKey}:null;
let token=sessionStorage.getItem('mq_admin_token')||''; let toastT; let ORDERS=[];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);};
const PLACEHOLDER='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#f3eef6"/><text x="40" y="46" font-size="11" text-anchor="middle" fill="#a99bb2">no img</text></svg>');
const img=u=>u||PLACEHOLDER;

async function sb(path, opt={}){
  const r=await fetch(`${SB.url}/rest/v1/${path}`,{...opt,headers:{apikey:SB.key,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:opt.prefer||'return=representation',...(opt.headers||{})}});
  if(r.status===401){logout();throw new Error('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại');}
  const j=r.status===204?null:await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&(j.message||j.error))||'Lỗi '+r.status);
  return j;
}
async function nodeOrders(){const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':token}});return r.json();}

async function login(){
  $('#loginErr').textContent='';
  try{
    if(SB){
      const r=await fetch(`${SB.url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#pass').value})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||'Sai email hoặc mật khẩu');
      token=j.access_token;
    } else { token=$('#key').value.trim(); const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':token}}); if(r.status===401) throw new Error('Sai mã quản trị'); }
    sessionStorage.setItem('mq_admin_token',token); $('#login').classList.add('hidden'); $('#adm').classList.remove('hidden'); show('dash');
  }catch(e){$('#loginErr').textContent=e.message;}
}
function logout(){token='';sessionStorage.removeItem('mq_admin_token');$('#adm').classList.add('hidden');$('#login').classList.remove('hidden');}

/* ================= Các trang ================= */
const V={};

V.dash=async()=>{
  if(!SB){ const o=await nodeOrders(); ORDERS=o;
    return `<h1>Tổng quan</h1><p class="sub">Đang chạy với server.js. Kết nối Supabase trong config.js để quản lý đầy đủ.</p>
      <div class="stats"><div class="stat"><b>${o.length}</b><span>Tổng đơn</span></div><div class="stat"><b>${o.filter(x=>x.status==='new').length}</b><span>Đơn mới</span></div><div class="stat"><b>${fmt(o.filter(x=>x.status!=='cancelled').reduce((a,x)=>a+x.total,0))}</b><span>Doanh thu</span></div></div>`; }
  const d=(await sb('v_dashboard'))[0];
  const recent=await sb('orders?select=*,order_items(*)&order=created_at.desc&limit=6'); ORDERS=recent;
  return `<h1>Tổng quan</h1><p class="sub">Tình hình cửa hàng hôm nay</p>
    <div class="stats">
      <div class="stat"><b>${d.total_orders}</b><span>Tổng đơn hàng</span></div>
      <div class="stat"><b>${d.new_orders}</b><span>Đơn mới cần xử lý</span></div>
      <div class="stat"><b>${fmt(d.revenue)}</b><span>Doanh thu (chưa hủy)</span></div>
      <div class="stat"><b>${d.customers}</b><span>Khách hàng</span></div>
      <div class="stat"><b>${d.active_products}</b><span>Sản phẩm đang bán</span></div>
      <div class="stat"><b>${d.pending_reviews}</b><span>Đánh giá chờ duyệt</span></div>
    </div>
    <h1 style="font-size:17px">Đơn hàng gần đây</h1><p class="sub">Bấm vào dòng để xem chi tiết</p>
    <div class="panel tbl-scroll"><table><tr><th>Ảnh</th><th>Mã đơn</th><th>Thời gian</th><th>Khách hàng</th><th>Tổng COD</th><th>Trạng thái</th></tr>
      ${recent.map(o=>rowHtml(o)).join('')||'<tr><td colspan="6" class="sm">Chưa có đơn hàng nào.</td></tr>'}</table></div>`;
};

function rowHtml(o){
  const items=o.order_items||o.items||[];
  return `<tr class="rowlink" data-code="${esc(o.code)}">
    <td><div class="thumbs">${items.slice(0,3).map(i=>`<img src="${img(i.image)}" alt="">`).join('')}</div></td>
    <td><b>${esc(o.code)}</b><div class="sm">${items.length} sản phẩm</div></td>
    <td class="sm">${dt(o.created_at||o.createdAt)}</td>
    <td><b>${esc(o.name||o.customer?.name)}</b><div class="sm">${esc(o.phone||o.customer?.phone)}</div></td>
    <td><b>${fmt(o.total)}</b></td>
    <td><span class="status ${o.status}">${ST[o.status]}</span></td></tr>`;
}

V.orders=async(q={})=>{
  let orders;
  if(SB){ let p='orders?select=*,order_items(*)&order=created_at.desc&limit=300';
    if(q.status) p+=`&status=eq.${q.status}`;
    if(q.s) p+=`&or=(code.ilike.*${encodeURIComponent(q.s)}*,phone.ilike.*${encodeURIComponent(q.s)}*,name.ilike.*${encodeURIComponent(q.s)}*)`;
    orders=await sb(p); }
  else { orders=(await nodeOrders()).map(o=>({...o,order_items:o.items,created_at:o.createdAt,name:o.customer.name,phone:o.customer.phone,address:o.customer.address,note:o.customer.note}));
    if(q.status) orders=orders.filter(o=>o.status===q.status);
    if(q.s){const k=q.s.toLowerCase(); orders=orders.filter(o=>(o.code+o.phone+o.name).toLowerCase().includes(k));} }
  ORDERS=orders;
  const sum=orders.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+o.total,0);
  return `<h1>Đơn hàng</h1><p class="sub">${orders.length} đơn · ${fmt(sum)} (không tính đơn hủy) · bấm vào dòng để xem chi tiết và ảnh sản phẩm</p>
    <div class="bar">
      <input id="oS" placeholder="🔍 Tìm mã đơn / SĐT / tên khách" value="${esc(q.s||'')}" style="min-width:250px">
      <select id="oSt"><option value="">Tất cả trạng thái</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${q.status===k?'selected':''}>${v}</option>`).join('')}</select>
      <button class="btn btn--sm" onclick="show('orders',{s:$('#oS').value,status:$('#oSt').value})">Lọc</button>
      <button class="btn btn--ghost btn--sm" onclick="show('orders')">Xoá lọc</button>
      <button class="btn btn--ghost btn--sm" onclick="exportCsv()">⬇ Xuất CSV</button>
    </div>
    <div class="panel tbl-scroll"><table><tr><th>Ảnh sản phẩm</th><th>Mã đơn</th><th>Thời gian</th><th>Khách hàng</th><th>Tổng COD</th><th>Trạng thái</th></tr>
      ${orders.map(o=>rowHtml(o)).join('')||'<tr><td colspan="6" class="sm">Không có đơn nào khớp bộ lọc.</td></tr>'}</table></div>`;
};

/* ---------- Ngăn chi tiết đơn ---------- */
window.openOrder=code=>{
  const o=ORDERS.find(x=>x.code===code); if(!o) return;
  const items=o.order_items||o.items||[];
  const cust={name:o.name||o.customer?.name,phone:o.phone||o.customer?.phone,address:o.address||o.customer?.address,note:o.note||o.customer?.note};
  $('#drawerPanel').innerHTML=`
    <div class="drawer__head"><img src="/img/icon.png" style="height:34px"><div><h2>Đơn ${esc(o.code)}</h2><div class="sm">${dt(o.created_at||o.createdAt)}</div></div><button class="drawer__close" onclick="closeDrawer()">✕</button></div>
    <div class="dsec"><h3>Trạng thái đơn</h3>
      <div class="statusrow">${Object.entries(ST).map(([k,v])=>`<button class="${o.status===k?'on':''}" onclick="setStatus('${esc(o.code)}','${k}')">${v}</button>`).join('')}</div></div>
    <div class="dsec"><h3>Người nhận</h3>
      <div class="dline"><span>Họ tên</span><b>${esc(cust.name)}</b></div>
      <div class="dline"><span>Điện thoại</span><b><a href="tel:${esc(cust.phone)}">${esc(cust.phone)}</a></b></div>
      <div class="dline"><span>Địa chỉ</span><span style="text-align:right">${esc(cust.address)}</span></div>
      ${cust.note?`<div class="dline"><span>Ghi chú của khách</span><span style="text-align:right">${esc(cust.note)}</span></div>`:''}
      <div class="copyline">
        <button class="btn btn--ghost btn--sm" onclick="copyAddr('${esc(o.code)}')">📋 Sao chép địa chỉ giao hàng</button>
        <a class="btn btn--ghost btn--sm" href="tel:${esc(cust.phone)}">📞 Gọi khách</a>
      </div></div>
    <div class="dsec"><h3>Sản phẩm (${items.length})</h3>
      ${items.map(i=>`<div class="ditem">
        <img src="${img(i.image)}" alt="" onclick="zoom(this.src)">
        <div><div class="ditem__name">${esc(i.name)}</div><div class="ditem__meta">${i.variant?'Phân loại: '+esc(i.variant)+' · ':''}${fmt(i.price)} × ${i.qty}${i.product_id||i.id?` · Mã SP: ${esc(i.product_id||i.id)}`:''}</div></div>
        <div class="ditem__right"><b>${fmt(i.price*i.qty)}</b></div></div>`).join('')}
      <div class="dtotal">
        <div class="dline"><span>Tạm tính</span><span>${fmt(o.subtotal)}</span></div>
        <div class="dline"><span>Phí vận chuyển</span><span>${o.shipping?fmt(o.shipping):'Miễn phí'}</span></div>
        <div class="dline"><span>Tổng thu khi giao (COD)</span><span>${fmt(o.total)}</span></div>
      </div></div>
    ${SB?`<div class="dsec"><h3>Ghi chú nội bộ</h3><textarea id="admNote" rows="3" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit">${esc(o.admin_note||'')}</textarea>
      <button class="btn btn--sm" style="margin-top:10px" onclick="saveNote('${esc(o.code)}')">Lưu ghi chú</button></div>`:''}
    <div class="dsec" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn--ghost btn--sm" onclick="printOrder('${esc(o.code)}')">🖨️ In phiếu giao hàng</button><button class="btn btn--ghost btn--sm" onclick="closeDrawer()">Đóng</button></div>`;
  $('#drawer').classList.add('open');
};
window.closeDrawer=()=>$('#drawer').classList.remove('open');
$('#drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer();};
window.zoom=src=>{const lb=$('#lightbox');lb.querySelector('img').src=src;lb.hidden=false;};
$('#lightbox').onclick=()=>$('#lightbox').hidden=true;
window.copyAddr=code=>{const o=ORDERS.find(x=>x.code===code);const c={name:o.name||o.customer?.name,phone:o.phone||o.customer?.phone,address:o.address||o.customer?.address};
  navigator.clipboard.writeText(`${c.name}\n${c.phone}\n${c.address}`).then(()=>toast('Đã sao chép địa chỉ')).catch(()=>toast('Không sao chép được'));};
window.saveNote=async code=>{try{await sb(`orders?code=eq.${code}`,{method:'PATCH',body:JSON.stringify({admin_note:$('#admNote').value})});toast('Đã lưu ghi chú');}catch(e){toast('❌ '+e.message);}};
window.setStatus=async(code,status)=>{
  try{
    if(SB) await sb(`orders?code=eq.${code}`,{method:'PATCH',body:JSON.stringify({status})});
    else await fetch('/api/admin/orders/'+code,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':token},body:JSON.stringify({status})});
    const o=ORDERS.find(x=>x.code===code); if(o) o.status=status;
    toast('Đơn '+code+' → '+ST[status]); openOrder(code); refreshRow(code,status);
  }catch(e){toast('❌ '+e.message);}
};

window.userscript=()=>`// ==UserScript==
// @name         Dong bo M&Q Toys tu Shopee
// @namespace    mqhometech
// @version      1.1
// @description  Tu cap nhat gia, ton kho, ten va anh tu Shopee ve website mqhometech.com

// @run-at       document-idle
// @grant        none
// ==/UserScript==
(function(){
  var KEY=${JSON.stringify(window.__SYNC_SECRET)}, GAP=6*60*60*1000;   // 6 tieng chay 1 lan
  try{ if(Date.now()-(+(localStorage.getItem('mq_last_sync')||0))<GAP) return; }catch(e){}
  setTimeout(function(){
    ${window.__SYNC_CODE}
    MQSync.run(KEY).then(function(){ try{localStorage.setItem('mq_last_sync',Date.now());}catch(e){} });
  }, 5000);
})();`;

// @name         Đồng bộ M&Q Toys từ Shopee
// @namespace    mqhometech
// @version      1.0
// @description  Tự cập nhật giá, tồn kho, ảnh từ Shopee về website mqhometech.com
// @match        https://shopee.vn/mqhometech*
// @grant        none
// ==/UserScript==
(function(){
  var KEY='${sec}', GAP=6*60*60*1000;            // 6 tiếng chạy 1 lần
